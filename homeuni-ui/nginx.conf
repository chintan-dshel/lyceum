/* NOT IN USE — superseded by single-service architecture.
   The API (Express) now serves the built UI static files directly via
   express.static('public') in src/index.js. This file was used by the
   homeuni-ui Docker container in the original two-service docker-compose
   setup. It is retained for reference only. */

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
